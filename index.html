<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Typing Speed Test — WPM Test Online — Tabutility</title>
<meta name="description" content="Free online typing speed test. Measure your WPM and accuracy. Multiple passages, real-time feedback and result history."/>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useEffect, useRef, useCallback } = React;

const PASSAGES = [
  "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump. The five boxing wizards jump quickly.",
  "Success is not final, failure is not fatal: it is the courage to continue that counts. In the middle of every difficulty lies opportunity. It always seems impossible until it is done.",
  "Technology is best when it brings people together. The advance of technology is based on making it fit in so that you don't really even notice it. Any sufficiently advanced technology is indistinguishable from magic.",
  "To be yourself in a world that is constantly trying to make you something else is the greatest accomplishment. Not all those who wander are lost. All we have to decide is what to do with the time that is given to us.",
  "The universe is under no obligation to make sense to you. We are all made of star stuff. Somewhere, something incredible is waiting to be known. Science knows no country, because knowledge belongs to humanity.",
];

function wpmRating(wpm) {
  if (wpm < 30) return { label: 'Beginner', color: '#ef4444' };
  if (wpm < 50) return { label: 'Average', color: '#f59e0b' };
  if (wpm < 70) return { label: 'Good', color: '#22c55e' };
  if (wpm < 100) return { label: 'Fast', color: '#38bdf8' };
  return { label: 'Expert', color: '#a855f7' };
}

export default function TypingTest() {
  const [passageIdx, setPassageIdx] = useState(0);
  const [passage, setPassage] = useState(PASSAGES[0]);
  const [typed, setTyped] = useState('');
  const [started, setStarted] = useState(false);
  const [finished, setFinished] = useState(false);
  const [startTime, setStartTime] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [wpm, setWpm] = useState(0);
  const [accuracy, setAccuracy] = useState(100);
  const [history, setHistory] = useState([]);
  const inputRef = useRef(null);
  const timerRef = useRef(null);

  useEffect(() => {
    if (started && !finished) {
      timerRef.current = setInterval(() => {
        const e = (Date.now() - startTime) / 1000;
        setElapsed(e);
        const words = typed.trim().split(/\s+/).filter(Boolean).length;
        setWpm(Math.round(words / (e / 60)));
      }, 200);
    }
    return () => clearInterval(timerRef.current);
  }, [started, finished, typed, startTime]);

  const handleChange = (e) => {
    const val = e.target.value;
    if (!started && val.length > 0) { setStarted(true); setStartTime(Date.now()); }
    setTyped(val);

    // Accuracy
    let correct = 0;
    for (let i = 0; i < val.length; i++) {
      if (val[i] === passage[i]) correct++;
    }
    const acc = val.length > 0 ? Math.round((correct / val.length) * 100) : 100;
    setAccuracy(acc);

    if (val.length >= passage.length) {
      clearInterval(timerRef.current);
      const finalElapsed = (Date.now() - startTime) / 1000;
      const words = passage.trim().split(/\s+/).length;
      const finalWpm = Math.round(words / (finalElapsed / 60));
      setWpm(finalWpm);
      setFinished(true);
      setHistory(h => [{wpm: finalWpm, acc, time: new Date().toLocaleTimeString()}, ...h.slice(0,9)]);
    }
  };

  const reset = (idx) => {
    const i = idx !== undefined ? idx : passageIdx;
    setPassageIdx(i); setPassage(PASSAGES[i]);
    setTyped(''); setStarted(false); setFinished(false);
    setStartTime(null); setElapsed(0); setWpm(0); setAccuracy(100);
    clearInterval(timerRef.current);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  };

  const words = passage.split('');
  const rating = wpmRating(wpm);

  return (
    <div style={{maxWidth:680,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Typing Speed Test</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:24}}>How fast do you type? Measure your WPM and accuracy.</p>

      {!finished && (
        <>
          <div style={{display:'flex',gap:20,justifyContent:'center',marginBottom:20}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'monospace',fontSize:32,fontWeight:700,color:'#38bdf8'}}>{started?wpm:0}</div>
              <div style={{fontSize:12,color:'#64748b'}}>WPM</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'monospace',fontSize:32,fontWeight:700,color:accuracy>=95?'#22c55e':accuracy>=80?'#f59e0b':'#ef4444'}}>{accuracy}%</div>
              <div style={{fontSize:12,color:'#64748b'}}>Accuracy</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'monospace',fontSize:32,fontWeight:700,color:'#f1f5f9'}}>{Math.floor(elapsed)}s</div>
              <div style={{fontSize:12,color:'#64748b'}}>Time</div>
            </div>
          </div>

          <div style={{background:'#1e293b',borderRadius:16,padding:20,border:'1px solid #334155',marginBottom:16,lineHeight:2,fontSize:18,fontFamily:'monospace',letterSpacing:0.5}}>
            {words.map((char, i) => {
              let color = '#475569';
              if (i < typed.length) {
                color = typed[i] === char ? '#22c55e' : '#ef4444';
              } else if (i === typed.length) {
                color = '#f1f5f9';
              }
              return (
                <span key={i} style={{color, background: i === typed.length ? 'rgba(56,189,248,0.2)' : 'transparent', borderRadius: 2}}>{char}</span>
              );
            })}
          </div>

          <textarea ref={inputRef} value={typed} onChange={handleChange} disabled={finished}
            placeholder="Start typing here…"
            style={{width:'100%',background:'#1e293b',color:'#f1f5f9',border:'2px solid',borderColor:started?'#38bdf8':'#334155',borderRadius:12,padding:'14px',fontSize:16,fontFamily:'monospace',resize:'vertical',minHeight:80,outline:'none',transition:'border-color 0.2s'}}/>

          <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12,flexWrap:'wrap'}}>
            <button onClick={() => reset()} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,padding:'8px 20px',fontSize:14,cursor:'pointer'}}>Restart</button>
            {PASSAGES.map((_,i) => (
              <button key={i} onClick={() => reset(i)} style={{background:passageIdx===i?'#38bdf8':'#1e293b',color:passageIdx===i?'#0f172a':'#64748b',border:'1px solid #334155',borderRadius:8,padding:'8px 14px',fontSize:13,cursor:'pointer'}}>Text {i+1}</button>
            ))}
          </div>
        </>
      )}

      {finished && (
        <div style={{background:'#1e293b',borderRadius:20,padding:'40px 24px',border:'2px solid #22c55e',textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:20,marginBottom:16}}>🎉 Test Complete!</div>
          <div style={{fontFamily:'monospace',fontSize:80,fontWeight:800,color:rating.color,lineHeight:1}}>{wpm}</div>
          <div style={{fontSize:20,color:'#94a3b8',marginBottom:4}}>WPM</div>
          <div style={{fontSize:18,fontWeight:600,color:rating.color,marginBottom:20}}>{rating.label}</div>
          <div style={{display:'flex',gap:24,justifyContent:'center',marginBottom:28}}>
            <div><div style={{fontSize:24,fontWeight:700,color:accuracy>=95?'#22c55e':'#f59e0b'}}>{accuracy}%</div><div style={{fontSize:13,color:'#64748b'}}>Accuracy</div></div>
            <div><div style={{fontSize:24,fontWeight:700,color:'#f1f5f9'}}>{Math.round(elapsed)}s</div><div style={{fontSize:13,color:'#64748b'}}>Time</div></div>
            <div><div style={{fontSize:24,fontWeight:700,color:'#f1f5f9'}}>{passage.trim().split(/\s+/).length}</div><div style={{fontSize:13,color:'#64748b'}}>Words</div></div>
          </div>
          <button onClick={() => reset()} style={{background:'#22c55e',color:'#0f172a',border:'none',borderRadius:12,padding:'14px 36px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Try Again</button>
        </div>
      )}

      {history.length > 0 && (
        <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155'}}>
          <h2 style={{fontSize:15,fontWeight:600,marginBottom:10}}>Recent Results</h2>
          {history.map((h,i) => (
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #0f172a',fontSize:14}}>
              <span style={{color:'#64748b'}}>{h.time}</span>
              <span style={{color:wpmRating(h.wpm).color,fontWeight:700}}>{h.wpm} WPM</span>
              <span style={{color:'#94a3b8'}}>{h.acc}% accuracy</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TypingTest />);
//]]>
</script>
</body>
</html>
